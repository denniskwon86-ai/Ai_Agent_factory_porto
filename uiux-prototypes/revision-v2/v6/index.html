ground:#6c59ae}.legend i.data{background:#3d9c9a}.detail{position:fixed;right:24px;top:94px;width:340px;padding:20px;border:1px solid #9d83ff55;border-radius:16px;background:#120d2cdd;box-shadow:0 25px 60px #0008;backdrop-filter:blur(18px)}.detail small{color:var(--cyan);font-weight:900;letter-spacing:.1em}.detail h1{margin:8px 0;font-size:24px}.detail p{color:#aaa4c1;line-height:1.65}.detail ul{padding:0;list-style:none}.detail li{padding:10px 0;border-top:1px solid #ffffff13}.detail li b{display:block}.detail li span{color:var(--muted);font-size:11px}.detail button{width:100%;padding:12px;border:0;border-radius:9px;color:#16102e;background:var(--cyan);font-weight:900}.search{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;width:490px;padding:11px 14px;border:1px solid #ffffff24;border-radius:16px;background:#171131dd;box-shadow:0 18px 45px #0007}.search span{color:var(--cyan)}.search input{flex:1;margin-left:10px;border:0;outline:0;color:white;background:transparent;font:inherit}.search kbd{padding:4px 6px;border-radius:5px;color:#aaa4bf;background:#ffffff10;font-size:10px}

e r="68"/><text y="-4">Digital Twin</text><text class="sub" y="18">경영·운영 시나리오</text></g><g class="node" data-key="operations" transform="translate(320 500)"><circle r="67"/><text y="-4">Operations</text><text class="sub" y="18">생산·품질·SCM</text></g><g class="node" data-key="data" transform="translate(400 245)"><circle r="72"/><text y="-4">Knowledge & Data</text><text class="sub" y="18">MDM·카탈로그·MCP</text></g><g class="node" data-key="portfolio" transform="translate(1130 130)"><circle r="48"/><text y="-3">Portfolio</text><text class="sub" y="16">전사 집계</text></g><line class="link" x1="990" y1="260" x2="1130" y2="130"/></svg></main><aside class="detail"><small id="eyebrow">COMPANY CORE</small><h1 id="title">LS MnM 회사 운영 코어</h1><p id="desc">회사·사업부·공장 계층과 권한, 업종 프로필, CI·상징색을 모든 SW와 시뮬레이션의 최상위 컨텍스트로 제공합니다.</p><ul><li><b id="m1">조직 범위</b><span id="s1">전사공통 · 배터리소재 · 제1·2공장</span></li><li><b id="m2">데이터 안전</b><span id="s2">Fail-closed · 감사 추적</span></li><li><b id="m3">연결 상태</b><span id="s3">8개 기능 도메인 연결</span></li></ul><button>이 영역 열기 →</button></aside><div class="legend"><b>관계 표시</b><span><i></i>기능·업무 연결</span><span><i class="data"></i>데이터·지식 흐름</span></div><div class="search"><span>✦</span><input value="Atlas에게 회사 전체 기능을 물어보세요" readonly><kbd>⌘ K</kbd></div><script>const info={company:['COMPANY CORE','LS MnM 회사 운영 코어','회사·사업부·공장 계층과 권한, 업종 프로필, CI·상징색을 모든 SW와 시뮬레이션의 최상위 컨텍스트로 제공합니다.'],atlas:['GLOBAL ASSISTANT','Atlas 전역 비서','Task ID 없이 회사 전체의 프로젝트·데이터·운영·시뮬레이션 상태를 설명하고 다음 행동을 제안합니다.'],factory:['BUILD','현업 SW Factory','상담·RFP·기획·아키텍처·WBS·에이전트 구현·품질·자가복구·릴리스가 연결됩니다.'],agents:['AGENT MESH','AI 에이전트 워크플로우','추천 엔진으로 에이전트를 구성하고 HOTL·Reviewer·QA·Supervisor로 품질과 비용을 제어합니다.'],release:['SCALE','릴리스·전사 라이브러리','생성한 SW와 지식을 권한 범위 안에서 공유·재사용하고 전사 자산으로 등록합니다.'],twin:['SIMULATE','경영·운영 Digital Twin','대외지표와 수주·구매·생산·품질·물류·회계 데이터를 연결해 조건별 결과를 비교합니다.'],operations:['OPERATE','전사 운영 그리드','생산·품질·SCM·물류·판매 업무와 현업 생성 SW를 한 운영체계로 연결합니다.'],data:['TRUST','지식·MDM·데이터 허브','카탈로그·용어·계보·품질·계약·Crosswalk·MCP로 모든 AI 산출물의 근거를 관리합니다.'],portfolio:['MANAGE','전사 포트폴리오','회사·사업부별 SW·시뮬레이션·데이터 준비도와 리스크·기회를 집계합니다.']};document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));n.classList.add('active');let a=info[n.dataset.key];eyebrow.textContent=a[0];title.textContent=a[1];desc.textContent=a[2]});</script></body></html>
