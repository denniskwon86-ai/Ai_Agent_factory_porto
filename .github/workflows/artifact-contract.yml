# ─────────────────────────────────────────────────────────────────────────────
# [P1 · DEP-02/09/10] 배포 산출물 계약 — Linux 합성 검사
#
# ── 실행 이력 (정정) ─────────────────────────────────────────────────────────
# 처음 여기에 「한 번도 실행된 적이 없다」고 적었다. **지금은 사실이 아니다** —
# 2026-09-21 푸시와 함께 4번 돌았다. 그 기록을 남긴다:
#
#   #1~#4  전부 Failure. 다만 «빌드 · 자산 확인 · 산출물 계약 검사 · manifest» 까지는
#          통과했다(실행 결과에 manifest 35.5KB 가 남아 있고, 검사가 걸리면 manifest 를
#          만들지 않는다). 즉 Linux 에서 npm ci · tsc -b · vite build · preview-vendor
#          3종 · 허용목록 · 완결성 · 비밀검사가 실제로 돌았다.
#   원인   마지막 「검사기 시험」 단계 하나. 아래 참조.
#
# ★ 걱정했던 대소문자 문제는 나오지 않았다. Linux 빌드는 통과했다.
#
# ⚠️ [DEP-10] **원격 쪽 설정은 여기서 만들어지지 않는다.** 필수 검사 지정(branch
#   protection)·요금제·승인 기능은 저장소 설정이며 **별도 확인 대상**이다.
#   이 파일이 있다는 것만으로 「CI 가 구축됐다」고 보고하지 않는다.
#
# 무엇을 하나
#   ① 프런트를 **실제로 빌드**한다 — `prebuild` 가 preview-vendor 3종을 만든다.
#   ② 산출물 계약을 검사한다(허용목록·내용·완결성·필수 자산) → 걸리면 **실패**.
#   ③ manifest(경로별 SHA-256)를 남긴다 — 「무엇을 배포했나」에 나중에 답하려고.
#
# ⚠️⚠️ **「검사기 자신을 시험한다」 단계는 여기서 뺐다** (2026-09-21).
#   처음엔 pytest 만 설치해 돌리려 했다. 「검사기는 표준 라이브러리만 쓴다」는 말은
#   맞지만 **시험 단계에는 적용되지 않았다** — `tests/conftest.py` 가 LLM 호출 격리를
#   걸려고 제품 모듈을 import 하고, 실패하면 «테스트를 실행하지 않음» 으로 닫는다.
#   그래서 `No module named 'langchain_core'` 로 24건이 통째로 error 났다.
#   ★ 그 conftest 는 **옳은 fail-closed 통제**다. `--confcutdir` 로 건너뛰어 초록을
#     만들지 않는다 — 그건 격리 통제를 꺼서 통과시키는 것이다.
#   ★ 의존성을 하나씩 채우는 것도 답이 아니었다: langchain-core 다음은 google, 그 뒤로
#     LLM 공급자들이 줄줄이 이어진다(실측). `requirements.txt` 전체는 torch·transformers
#     까지 끌고 온다.
#   → **검사기 시험 29건은 로컬 격리 러너에서 돈다**(`scripts/verify_data_usage_holds.py`,
#     쓰기 보호·감사 포함). CI 에 올리려면 제품 의존성을 설치하는 «별도 job» 이 필요하고,
#     그건 비용이 드는 CI 설계 결정이라 소유자 판단으로 남긴다.
#
# 무엇을 «안» 하나
#   · 배포하지 않는다. P1 은 **계약** 이지 전달이 아니다.
#   · 비밀을 쓰지 않는다. 이 작업에 필요한 secret 은 **하나도 없다**.
#   · 제품 의존성을 설치하지 않는다 — 위 이유로 시험 단계 자체를 두지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
name: artifact-contract

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 읽기만 한다. 이 작업은 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: artifact-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 코드 받기
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # 이후 단계에 토큰을 남기지 않는다.

      - name: Node 준비
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프런트 의존성 설치
        working-directory: frontend
        run: npm ci

      # `build` = `tsc -b && vite build` 이고, `prebuild` 가 preview-vendor 3종을 만든다.
      # ⚠️ 타입 검사는 반드시 `tsc -b` 여야 한다 — `tsc -p tsconfig.json` 은 0개 파일을
      #   검사하고 **조용히 통과**한다. package.json 의 build 가 이미 `-b` 를 쓴다.
      - name: 프런트 빌드(미리보기 vendor 포함)
        working-directory: frontend
        run: npm run build

      - name: 빌드 산출물이 실제로 생겼는지
        run: |
          set -eu
          for f in frontend/dist/index.html \
                   frontend/dist/preview-vendor/runtime.js \
                   frontend/dist/preview-vendor/babel.js \
                   frontend/dist/preview-vendor/tailwind.js; do
            test -s "$f" || { echo "::error::필수 자산이 없거나 비어 있다: $f"; exit 1; }
          done

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 검사기는 표준 라이브러리만 쓴다 — 설치할 것이 없다.
      # 걸리면 manifest 를 만들지 않고 0 이 아닌 코드로 끝난다.
      - name: 산출물 계약 검사 + manifest
        run: python scripts/release_artifact.py --manifest artifacts/manifest.json

      - name: manifest 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: artifacts/manifest.json
          if-no-files-found: ignore
          retention-days: 30
