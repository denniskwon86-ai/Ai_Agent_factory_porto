# 🌟 AI Multi-Agent Factory 
> **"다양한 AI 전문가들이 모여, 당신이 원하는 모든 것을 만들어내는 스마트 팩토리"**

```mermaid

  root((AI Factory))

      React App
      A4 보고서
      PPT 슬라이드
      다이어그램
    사용자 제어
      피드백 개입
      승인 시스템

## 1. 프로젝트가 해결하려는 문제 🎯
현재의 AI 도구들은 대부분 '채팅봇' 형태이거나, 정해진 '코드'만을 뱉어내는 데 그치고 있습니다. 하지만 실제 업무에서는 코드뿐만 아니라 **보고서, 아키텍처 다이어그램, 발표용 슬라이드, 데이터 파일 등 다양한 형태의 결과물**이 필요합니다.

**AI Multi-Agent Factory**는 단일 AI의 한계를 넘어, **각기 다른 역할을 부여받은 여러 AI 에이전트(기획자, 개발자, QA 등)가 팀을 이루어 협업**하며, 사용자가 요구하는 **가장 최적화된 포맷으로 결과물을 생산**하는 플랫폼입니다.

---

## 2. 핵심 비전: "Any Workflow, Any Output" 🚀

> [!IMPORTANT]
> **핵심 차별점 4가지**
> 1. **Multi-Agent Workflow**: 단순 프롬프팅이 아닌, 전문가 AI들의 파이프라인
> 2. **Dynamic Renderer**: 결과물의 성격에 맞춰 즉각적으로 변신하는 뷰어
> 3. **Human-in-the-loop (HITL)**: 인간이 완벽하게 통제하고 개입할 수 있는 프로세스
> 4. **Smart LLM Routing (Zero-Cost)**: 무료 티어 API 자동 라우팅을 통한 압도적인 비용 절감

### 🧩 1) Multi-Agent Workflow (유연한 에이전트 조립)
- 기획자, 백엔드 엔지니어, 프론트엔드 개발자, 리뷰어 등 목적에 따라 AI 요원들을 조립하여 나만의 **'소프트웨어 공장'**을 구축합니다.

### 🎨 2) Format Master & Dynamic Renderer (다이나믹 렌더러)
- 결과물은 더 이상 단순한 텍스트나 코드가 아닙니다. 목적에 맞는 형태를 강제하고, 이를 위한 전용 뷰어를 실시간으로 제공합니다.
  - 🖥️ **React App**: 샌드박스 위에서 살아 숨쉬는 웹 애플리케이션
  - 📝 **A4 Report**: 깔끔한 타이포그래피가 적용된 기획/문서 보고서
  - 📊 **Mermaid Diagram**: 복잡한 시스템과 로직을 한눈에 보여주는 다이어그램
  - 📽️ **Presentation Slide**: 클릭으로 넘겨볼 수 있는 발표용 PPT 슬라이드
  - 💻 **JSON Data**: 시스템 연동 및 분석을 위한 깔끔한 데이터 포맷

### ✋ 3) Human-in-the-loop (인간-AI 협업)
- AI가 알아서 다 해버리고 끝나는 블랙박스가 아닙니다. 
- 중요한 단계(기획 승인, 코드 리뷰 등)에서 AI가 잠시 멈추고 인간의 **승인(Approve) 혹은 피드백(Revision)**을 받도록 설계되었습니다.

### 💸 4) Smart LLM Routing (비용 제약 없는 AI 팩토리)
- Multi-Agent 시스템을 도입할 때 기업들이 가장 우려하는 **'천문학적인 API 토큰 비용'** 문제를 완벽하게 해결했습니다.
- 여러 LLM 서비스의 **무료 티어(Free Tier) 모델들을 시스템이 알아서 자동 라우팅하고 로드밸런싱**하여 사용합니다. 수십 명의 AI 요원이 밤낮없이 토론하고 코드를 작성해도 **운영 비용이 사실상 0원에 수렴**하는 극강의 가성비를 자랑합니다.

## 3. 현재까지의 개발 완료 현황 🏆

우리는 위 비전을 달성하기 위한 **가장 핵심적인 뼈대(인프라)와 뷰어 시스템**을 완벽하게 구축했습니다.

| 구분 | 완료된 기능 (Features) | 상세 내용 |
|:---:|---|---|
| **상태 관리** | `view_type` 스키마 통합 | 프론트엔드와 백엔드 간에 뷰어 타입 데이터가 유실되지 않도록 전구간 데이터 파이프라인 개편 완료 |
| **마스터 제어판** | 포맷 편집기 UI 적용 | 관리자가 포맷 생성 시 5가지의 렌더링 뷰어(App, Markdown, JSON, Slide, Mermaid) 중 하나를 매핑할 수 있는 UI 구현 |
| **다이나믹 뷰어** | 조건부 렌더링 컴포넌트 | 결과물의 메타데이터를 인식하여, **화면 전체가 5가지 뷰어 중 알맞은 형태로 자동 전환**되는 `PreviewPanel` 인프라 구축 완료 |
| **프로젝트 메타** | 디스크 영속성 보장 | 프로젝트 생성 시 선택된 포맷 정보가 `project_meta.json`에 영구 기록되어 브라우저 새로고침 시에도 유지됨 |

## 5. 다음 단계 (Next Steps) 🚀

가장 어려운 인프라와 그릇(Viewer)을 모두 만들었습니다. 이제 이 멋진 그릇에 최고 품질의 내용물을 담아낼 차례입니다.

1. **프롬프트 엔지니어링 고도화 (Prompt Injection)**
   - 각 포맷(Slide, Mermaid 등)의 문법을 AI가 한 치의 오차 없이 생성하도록 'Harness Rules(강제 규칙)'를 정밀하게 튜닝합니다.
2. **워크플로우 템플릿 프리셋 제공**
   - 사용자들에게 바로 제공할 수 있는 매력적인 프리셋(예: "스타트업 IR 피치덱 생성기", "DB 아키텍처 설계 자동화")을 구성합니다.
3. **오류 자가 치유(Self-Healing) 안정화**
   - 렌더링 문법 오류 발생 시, 사람의 개입 없이 AI가 스스로 에러 로그를 읽고 코드를 수정하는 과정을 더욱 매끄럽게 폴리싱합니다.

        if (language === 'mermaid') {
          const unescaped = code.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          return '<div class="mermaid">' + unescaped + '</div>';
        }
        return defaultCodeRenderer(code, language, isEscaped);
      };

      // Custom blockquote rendering for GitHub alerts (e.g. [!IMPORTANT])
      const defaultBlockquoteRenderer = renderer.blockquote.bind(renderer);
      renderer.blockquote = function(quote) {
        if (quote.includes('[!IMPORTANT]')) {
          const cleaned = quote.replace('\\[!IMPORTANT\\]', '').replace('[!IMPORTANT]', '');
          return `<blockquote style="border-left: 4px solid #8b5cf6; background-color: #f5f3ff; color: #5b21b6;"><strong>💡 중요</strong><br/>${cleaned}</blockquote>`;
        }
        return defaultBlockquoteRenderer(quote);
      };
      
      const rawMd = document.getElementById('markdown-source').value;
