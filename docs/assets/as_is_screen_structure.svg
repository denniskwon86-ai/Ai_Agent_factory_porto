    <rect x="1060" y="416" width="210" height="132" rx="14" fill="#e8f2fb"/><text x="1165" y="465" text-anchor="middle" class="b">작업 공간 탭</text><text x="1165" y="493" text-anchor="middle" class="tiny">Mega · Vault</text><text x="1165" y="516" text-anchor="middle" class="tiny">결과물 라이브러리</text>
    <rect x="1288" y="416" width="210" height="132" rx="14" fill="#e8f2fb"/><text x="1393" y="465" text-anchor="middle" class="b">공통 관리 진입</text><text x="1393" y="493" text-anchor="middle" class="tiny">지식 · MDM · 표준</text><text x="1393" y="516" text-anchor="middle" class="tiny">MCP · 운영 정보</text>
    <text x="832" y="582" class="s">프로젝트를 선택하기 전 생성·탐색·공통 데이터 관리 기능을 제공</text>
  </g>

  <g filter="url(#shadow)">
