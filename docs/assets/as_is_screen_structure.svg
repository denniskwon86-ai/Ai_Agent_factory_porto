<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".14"/></filter>
    <style>
      .title{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-weight:700;fill:#fff}.t1{font-size:34px}.t2{font-size:18px}
      .h{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:22px;font-weight:700;fill:#102a43}.s{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:16px;fill:#52677d}.b{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:17px;font-weight:600;fill:#17365d}.w{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#fff}.tiny{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:14px;fill:#52677d}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f5f8fc"/>
  <rect x="0" y="0" width="1600" height="104" fill="#0b1f33"/>
  <text x="70" y="52" class="title t1">AI Factory Studio · 현재 App 화면 구조</text>
  <text x="70" y="82" class="title t2" opacity=".78">As-Is 화면 상태에 따라 하나의 App Shell이 네 가지 작업 공간으로 전환됨</text>
  <rect x="1320" y="30" rx="18" width="210" height="40" fill="#2b6cb0"/><text x="1425" y="56" text-anchor="middle" class="w">CURRENT / AS-IS</text>

  <text x="70" y="150" class="h">1. App Shell의 전환 규칙</text>
  <text x="70" y="178" class="s">상단의 전역 전체화면이 우선하며, 그 외에는 선택한 프로젝트 유형과 선택 상태가 작업 공간을 결정합니다.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="208" width="330" height="70" rx="16" fill="#7158a6"/><text x="235" y="238" text-anchor="middle" class="w">전역 전체화면</text><text x="235" y="262" text-anchor="middle" class="title t2">에이전트 · 양식 · 결과물 실행</text>
    <rect x="430" y="208" width="330" height="70" rx="16" fill="#2b6cb0"/><text x="595" y="238" text-anchor="middle" class="w">프로젝트 미선택</text><text x="595" y="262" text-anchor="middle" class="title t2">Private AI Cockpit</text>
    <rect x="790" y="208" width="330" height="70" rx="16" fill="#148a88"/><text x="955" y="238" text-anchor="middle" class="w">Mega 프로젝트 선택</text><text x="955" y="262" text-anchor="middle" class="title t2">Mega Boardroom</text>
    <rect x="1150" y="208" width="380" height="70" rx="16" fill="#2f855a"/><text x="1340" y="238" text-anchor="middle" class="w">독립 프로젝트 선택</text><text x="1340" y="262" text-anchor="middle" class="title t2">Project Control Room</text>
  </g>
  <path d="M400 243H420M760 243H780M1120 243H1140" stroke="#8da6bd" stroke-width="4" stroke-linecap="round"/>

