    <rect x="325" y="416" width="190" height="132" rx="14" fill="#f0ebf8"/><text x="420" y="465" text-anchor="middle" class="b">Format Master</text><text x="420" y="493" text-anchor="middle" class="tiny">출력 양식</text><text x="420" y="516" text-anchor="middle" class="tiny">프롬프트 주입</text>
    <rect x="548" y="416" width="190" height="132" rx="14" fill="#f0ebf8"/><text x="643" y="465" text-anchor="middle" class="b">Release Viewer</text><text x="643" y="493" text-anchor="middle" class="tiny">릴리스 결과물</text><text x="643" y="516" text-anchor="middle" class="tiny">문서/코드 확인</text>
    <text x="102" y="582" class="s">프로젝트 컨텍스트보다 우선해 App 전체 영역을 대체하는 관리 화면</text>

    <rect x="800" y="330" width="730" height="280" rx="20" fill="#fff"/>
    <rect x="800" y="330" width="730" height="54" rx="20" fill="#2474bb"/><rect x="800" y="364" width="730" height="20" fill="#2474bb"/>
