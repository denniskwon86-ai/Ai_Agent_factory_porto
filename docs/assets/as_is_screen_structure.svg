    <rect x="602" y="726" width="896" height="34" rx="8" fill="#e8f5ec"/><text x="620" y="749" class="b">상단 프로젝트 바  ·  Workflow Strip (현재 단계/에이전트 흐름)</text>
    <rect x="602" y="782" width="190" height="128" rx="12" fill="#edf8f0"/><text x="697" y="832" text-anchor="middle" class="b">Control Panel</text><text x="697" y="860" text-anchor="middle" class="tiny">22% · 시작/중지</text><text x="697" y="882" text-anchor="middle" class="tiny">WBS/릴리스/내보내기</text>
    <rect x="812" y="782" width="342" height="128" rx="12" fill="#edf8f0"/><text x="983" y="832" text-anchor="middle" class="b">Timeline Panel</text><text x="983" y="860" text-anchor="middle" class="tiny">40% · SSE 활동/피드</text><text x="983" y="882" text-anchor="middle" class="tiny">에이전트 진행 이력</text>
    <rect x="1174" y="782" width="324" height="128" rx="12" fill="#edf8f0"/><text x="1336" y="832" text-anchor="middle" class="b">Preview Panel</text><text x="1336" y="860" text-anchor="middle" class="tiny">38% · 산출물/문서</text><text x="1336" y="882" text-anchor="middle" class="tiny">코드/미리보기/추적성</text>
    <rect x="602" y="928" width="896" height="30" rx="8" fill="#fff1dc"/><text x="620" y="950" class="b">HOTL Input · 요구사항 선택형 확인, 승인/수정 피드백, 프로젝트 문맥 슈퍼바이저 대화</text>
  </g>
  <text x="800" y="1030" text-anchor="middle" class="tiny">전역 오버레이/패널: 지식 허브 · M1 기준정보 · 업무표준 · Crosswalk/MCP · 텔레메트리 · 스킬 진화 · 서버 로그</text>
