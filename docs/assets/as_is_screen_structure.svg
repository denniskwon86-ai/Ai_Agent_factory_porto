    <rect x="102" y="810" width="116" height="94" rx="12" fill="#eef8f8"/><text x="160" y="850" text-anchor="middle" class="b">Sub A</text><text x="160" y="876" text-anchor="middle" class="tiny">진행 상태</text>
    <rect x="247" y="810" width="116" height="94" rx="12" fill="#eef8f8"/><text x="305" y="850" text-anchor="middle" class="b">Sub B</text><text x="305" y="876" text-anchor="middle" class="tiny">진행 상태</text>
    <rect x="392" y="810" width="116" height="94" rx="12" fill="#eef8f8"/><text x="450" y="850" text-anchor="middle" class="b">Sub N</text><text x="450" y="876" text-anchor="middle" class="tiny">진행 상태</text>
    <text x="102" y="950" class="s">개별 하위 프로젝트 통제실로 진입 가능</text>

