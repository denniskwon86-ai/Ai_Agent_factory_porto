<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">LAXS-M 부서 시뮬레이션과 전사 경영 시나리오 결합 구조</title>
  <desc id="desc">원료매입, 생산, 판매 시뮬레이션이 공통 전사 데이터, RAG, 경영 온톨로지를 통해 하나의 경영 시나리오로 결합되는 개념도</desc>
  <defs>
    <linearGradient id="core" x1="0" x2="1"><stop offset="0" stop-color="#0b365f"/><stop offset="1" stop-color="#124f77"/></linearGradient><linearGradient id="enterprise" x1="0" x2="1"><stop offset="0" stop-color="#c9142d"/><stop offset="1" stop-color="#e83a4c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0a2744" flood-opacity=".14"/></filter>
    <marker id="arrowNavy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l10 5-10 5z" fill="#315e7b"/></marker><marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l10 5-10 5z" fill="#d82439"/></marker>
    <style>text{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',Arial,sans-serif}.label{font-size:17px;font-weight:800;letter-spacing:.06em;fill:#6d7c8b}.title{font-size:29px;font-weight:900;fill:#092d50}.copy{font-size:18px;font-weight:650;fill:#5d6b79}.white{fill:#fff}.white2{fill:#dce9f2}.red2{fill:#ffe7eb}.chip{font-size:15px;font-weight:850;fill:#0d3c61}.metric{font-size:21px;font-weight:900;fill:#fff}</style>
  </defs>
  <rect width="1600" height="560" rx="26" fill="#f3f6f9"/><text x="58" y="48" class="label">DEPARTMENT SIMULATORS</text><text x="565" y="48" class="label">ONE ENTERPRISE FOUNDATION</text><text x="1188" y="48" class="label">MANAGEMENT COMPOSITION</text>
  <g filter="url(#shadow)">
    <rect x="58" y="78" width="405" height="120" rx="18" fill="#fff" stroke="#dbe3ea" stroke-width="2"/><rect x="58" y="78" width="12" height="120" rx="6" fill="#e6233c"/><circle cx="112" cy="121" r="22" fill="#ffe4e8"/><path d="M101 121h22M112 110v22" stroke="#d81f37" stroke-width="5" stroke-linecap="round"/><text x="153" y="119" class="title">원료매입 시뮬레이터</text><text x="153" y="153" class="copy">가격 · 환율 · 도입 지연 · 구매자금</text><text x="153" y="178" class="label" style="font-size:14px;fill:#d81f37">PURCHASE SCENARIO</text>
    <rect x="58" y="220" width="405" height="120" rx="18" fill="#fff" stroke="#dbe3ea" stroke-width="2"/><rect x="58" y="220" width="12" height="120" rx="6" fill="#1494aa"/><circle cx="112" cy="263" r="22" fill="#def4f7"/><path d="M99 273h26v-20l-8 7v-10l-9 8v-12h-9z" fill="none" stroke="#14879b" stroke-width="4" stroke-linejoin="round"/><text x="153" y="261" class="title">생산 시뮬레이터</text><text x="153" y="295" class="copy">재고 · BOM · 설비 · 생산계획</text><text x="153" y="320" class="label" style="font-size:14px;fill:#14879b">PRODUCTION SCENARIO</text>
    <rect x="58" y="362" width="405" height="120" rx="18" fill="#fff" stroke="#dbe3ea" stroke-width="2"/><rect x="58" y="362" width="12" height="120" rx="6" fill="#e3a119"/><circle cx="112" cy="405" r="22" fill="#fff1cf"/><path d="M99 415l9-11 8 5 10-17" fill="none" stroke="#c98708" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="403" class="title">판매 시뮬레이터</text><text x="153" y="437" class="copy">수주 · 납기 · 매출인식 · 채권</text><text x="153" y="462" class="label" style="font-size:14px;fill:#b87800">SALES SCENARIO</text>
  </g>
  <path d="M490 138H535" fill="none" stroke="#315e7b" stroke-width="5" marker-end="url(#arrowNavy)"/><path d="M490 280H535" fill="none" stroke="#315e7b" stroke-width="5" marker-end="url(#arrowNavy)"/><path d="M490 422H535" fill="none" stroke="#315e7b" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <g filter="url(#shadow)"><rect x="560" y="78" width="460" height="404" rx="26" fill="url(#core)"/><text x="600" y="132" class="label white2">SHARED CONTEXT</text><text x="600" y="174" class="title white" style="font-size:27px">같은 데이터와 지식을 바라봅니다</text><text x="600" y="207" class="copy white2">부서별 결과를 다시 취합하지 않고 처음부터</text><text x="600" y="233" class="copy white2">동일한 회사 문맥과 기준선으로 연결합니다.</text>
    <rect x="600" y="270" width="185" height="64" rx="12" fill="#fff"/><text x="692" y="297" text-anchor="middle" class="chip">전사 MDM</text><text x="692" y="320" text-anchor="middle" class="copy" style="font-size:14px">기준정보 · 데이터 계약</text><rect x="800" y="270" width="185" height="64" rx="12" fill="#fff"/><text x="892" y="297" text-anchor="middle" class="chip">업무지식 · RAG</text><text x="892" y="320" text-anchor="middle" class="copy" style="font-size:14px">문서 · 근거 · 대외지표</text>
    <rect x="600" y="350" width="385" height="76" rx="12" fill="#e8f4f7" stroke="#52afbf" stroke-width="2"/><text x="792" y="381" text-anchor="middle" class="chip" style="font-size:19px">경영 온톨로지</text><text x="792" y="407" text-anchor="middle" class="copy" style="font-size:15px">구매 → 재고 → 생산 → 판매 → 손익·현금 의미 연결</text><text x="790" y="458" text-anchor="middle" class="label white2" style="font-size:14px">SAME COMPANY · SAME BASELINE · SAME GOVERNANCE</text></g>
  <path d="M1045 280H1125" fill="none" stroke="#d82439" stroke-width="7" marker-end="url(#arrowRed)"/>
  <g filter="url(#shadow)"><rect x="1160" y="78" width="382" height="404" rx="26" fill="url(#enterprise)"/><text x="1192" y="132" class="label red2">ONE MANAGEMENT SCENARIO</text><text x="1192" y="174" class="title white">하나의 전사 경영 시나리오</text><text x="1192" y="207" class="copy red2">부서 가정을 조합해 전사 영향과</text><text x="1192" y="233" class="copy red2">부서별 기여도를 함께 계산합니다.</text>
    <rect x="1192" y="270" width="135" height="70" rx="13" fill="#ffffff26" stroke="#ffffff6b" stroke-width="2"/><text x="1259" y="313" text-anchor="middle" class="metric">손익</text><rect x="1341" y="270" width="161" height="70" rx="13" fill="#ffffff26" stroke="#ffffff6b" stroke-width="2"/><text x="1421" y="313" text-anchor="middle" class="metric">현금흐름</text><rect x="1192" y="354" width="135" height="70" rx="13" fill="#ffffff26" stroke="#ffffff6b" stroke-width="2"/><text x="1259" y="397" text-anchor="middle" class="metric">납기</text><rect x="1341" y="354" width="161" height="70" rx="13" fill="#ffffff26" stroke="#ffffff6b" stroke-width="2"/><text x="1421" y="397" text-anchor="middle" class="metric">실행 우선순위</text><text x="1351" y="458" text-anchor="middle" class="label red2" style="font-size:14px">DECISION · ACTION · EFFECT MEASUREMENT</text></g>
  <rect x="58" y="514" width="1484" height="2" fill="#d7e0e8"/><text x="800" y="544" text-anchor="middle" class="copy" style="font-size:17px;font-weight:800;fill:#173c59">부서는 자기 업무를 직접 개선하고, 경영층은 그 결과를 하나의 전사 영향으로 판단합니다.</text>
</svg>
